<div class="relative min-h-screen flex flex-col justify-center items-center p-4 overflow-hidden bg-slate-900">
  <!-- Fundo ilustrado: pátio de carvão, correia transportadora e retomador/empilhadeira -->
  <svg class="absolute inset-0 w-full h-full" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="loginSky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0b1220" />
        <stop offset="55%" stop-color="#0f2338" />
        <stop offset="100%" stop-color="#1c3a52" />
      </linearGradient>
      <linearGradient id="loginGlow" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.16" />
        <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
      </linearGradient>
    </defs>

    <rect x="0" y="0" width="1600" height="900" fill="url(#loginSky)" />
    <ellipse cx="1180" cy="640" rx="520" ry="220" fill="url(#loginGlow)" />

    <!-- Pátio de carvão (pilhas) -->
    <path d="M0,760 Q120,660 260,740 Q420,650 560,730 Q640,690 720,735 L720,900 L0,900 Z" fill="#111c2b" />
    <path d="M480,780 Q640,670 820,760 Q960,680 1120,750 Q1260,700 1400,760 L1600,780 L1600,900 L480,900 Z" fill="#152436" />
    <path d="M900,800 Q1040,730 1180,795 Q1320,740 1460,800 L1600,810 L1600,900 L900,900 Z" fill="#0e1a29" />

    <!-- Correia transportadora inclinada, subindo até a torre de transferência -->
    <g stroke="#2c4257" stroke-width="4" fill="none">
      <line x1="120" y1="770" x2="560" y2="430" />
      <line x1="150" y1="800" x2="590" y2="460" />
      <line x1="120" y1="770" x2="150" y2="800" />
      <line x1="200" y1="722" x2="230" y2="752" />
      <line x1="280" y1="674" x2="310" y2="704" />
      <line x1="360" y1="626" x2="390" y2="656" />
      <line x1="440" y1="578" x2="470" y2="608" />
      <line x1="520" y1="530" x2="550" y2="560" />
    </g>
    <g fill="#3a5872">
      <circle cx="170" cy="778" r="9" />
      <circle cx="255" cy="713" r="9" />
      <circle cx="340" cy="648" r="9" />
      <circle cx="425" cy="583" r="9" />
      <circle cx="505" cy="522" r="9" />
      <circle cx="565" cy="445" r="10" />
    </g>

    <!-- Torre de transferência -->
    <g fill="#152436" stroke="#233549" stroke-width="3">
      <rect x="520" y="380" width="100" height="150" rx="4" />
      <path d="M510,380 L570,335 L630,380 Z" />
    </g>

    <!-- Retomador / empilhadeira de pátio (stacker-reclaimer) -->
    <g>
      <!-- Trilho e base rodante -->
      <rect x="990" y="705" width="260" height="10" rx="3" fill="#1c2c3d" />
      <rect x="1010" y="675" width="220" height="34" rx="6" fill="#16283a" stroke="#2c4257" stroke-width="3" />
      <circle cx="1045" cy="712" r="10" fill="#233549" />
      <circle cx="1100" cy="712" r="10" fill="#233549" />
      <circle cx="1155" cy="712" r="10" fill="#233549" />
      <circle cx="1210" cy="712" r="10" fill="#233549" />

      <!-- Mastro central -->
      <rect x="1105" y="470" width="18" height="210" fill="#1c2c3d" />
      <line x1="1075" y1="675" x2="1114" y2="475" stroke="#2c4257" stroke-width="6" />
      <line x1="1153" y1="675" x2="1114" y2="475" stroke="#2c4257" stroke-width="6" />

      <!-- Lança principal (alcança a pilha) -->
      <line x1="1114" y1="480" x2="820" y2="620" stroke="#2c4257" stroke-width="10" stroke-linecap="round" />
      <g stroke="#3a5872" stroke-width="3">
        <line x1="1080" y1="510" x2="1050" y2="540" />
        <line x1="1010" y1="545" x2="980" y2="575" />
        <line x1="940" y1="580" x2="910" y2="610" />
      </g>
      <circle cx="822" cy="620" r="10" fill="#3a5872" />

      <!-- Contra-lança e contrapeso -->
      <line x1="1114" y1="480" x2="1290" y2="545" stroke="#2c4257" stroke-width="9" stroke-linecap="round" />
      <rect x="1275" y="535" width="42" height="30" rx="4" fill="#16283a" stroke="#2c4257" stroke-width="3" />

      <!-- Luzes de sinalização -->
      <circle cx="1114" cy="472" r="4" fill="#f59e0b" opacity="0.85" />
      <circle cx="822" cy="620" r="4" fill="#f59e0b" opacity="0.6" />
    </g>

    <!-- Horizonte -->
    <line x1="0" y1="760" x2="1600" y2="760" stroke="#0a1420" stroke-width="2" opacity="0.4" />
  </svg>

  <div class="relative z-10 bg-white shadow-xl rounded-lg p-8 md:p-12 w-full max-w-lg">
    <div class="mb-8 text-center">
      <div class="mb-3 flex justify-center">
        <img src="/company-logo.png" alt="Logo da empresa" class="h-8 md:h-10 w-auto object-contain" />
      </div>
      <h1 class="text-lg md:text-xl font-semibold text-slate-800 leading-tight">
        Portal PPTM
      </h1>
      <p class="mt-1 text-xs md:text-sm text-slate-500 leading-normal">
        Plataforma Integrada de Operações
      </p>
    </div>

    <form (ngSubmit)="onLogin()" class="space-y-6">
      <div>
        <label for="email" class="block text-sm font-medium text-slate-700">E-mail <span class="text-red-500">*</span></label>
        <div class="mt-1 relative rounded-md shadow-sm">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg class="h-5 w-5 text-slate-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" /><path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" /></svg>
          </div>
             <input type="email" id="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email"
                 class="block w-full pl-10 pr-3 py-3 border border-slate-300 rounded-md leading-5 bg-white placeholder-slate-500 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                 placeholder="seu.email@company.com" required>
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-700">Senha <span class="text-red-500">*</span></label>
        <div class="mt-1 relative rounded-md shadow-sm">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg class="h-5 w-5 text-slate-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10 1a4.5 4.5 0 00-4.5 4.5V9H5a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2h-.5V5.5A4.5 4.5 0 0010 1zm3 8V5.5a3 3 0 10-6 0V9h6z" clip-rule="evenodd" /></svg>
          </div>
             <input type="password" id="password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password"
                 class="block w-full pl-10 pr-3 py-3 border border-slate-300 rounded-md leading-5 bg-white placeholder-slate-500 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                 placeholder="********" required>
        </div>
      </div>

      @if(error()) {
        <div class="rounded-md bg-red-50 p-4 border border-red-200">
          <div class="flex">
            <div class="flex-shrink-0">
              <svg class="h-5 w-5 text-red-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
              </svg>
            </div>
            <div class="ml-3">
              <p class="text-sm font-medium text-red-800">{{ error() }}</p>
            </div>
          </div>
        </div>
      }
      
      <div class="flex items-start">
        <div class="flex items-center h-5">
          <input id="consent" type="checkbox" [ngModel]="consentGiven()" (ngModelChange)="consentGiven.set($event)" name="consent"
            class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded cursor-pointer">
        </div>
        <label for="consent" class="ml-2 block text-xs text-slate-600 leading-relaxed cursor-pointer">
          Li e concordo com a
          <a routerLink="/privacy-policy" class="text-blue-600 hover:text-blue-700 font-medium underline">Política de Privacidade</a>
          e o tratamento dos meus dados pessoais conforme a LGPD.
        </label>
      </div>

      <button type="submit" [disabled]="isLoggingIn() || !consentGiven()" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150 ease-in-out shadow-lg flex items-center justify-center disabled:bg-blue-400 disabled:cursor-not-allowed">
        @if(isLoggingIn()) {
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Autenticando...</span>
        } @else {
          <span>Entrar no Sistema</span>
        }
      </button>

      <div class="text-center pt-4 border-t border-slate-200">
        <a routerLink="/forgot-password" class="text-blue-600 hover:text-blue-700 text-sm font-medium">
          Esqueci minha senha
        </a>
      </div>

      <!-- Primeiro acesso information intentionally removed to avoid exposing credentials in the UI -->

    </form>
  </div>
</div>
