@if (alvo(); as ordem) {
  <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4" (click)="fechar()">
    <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md" (click)="$event.stopPropagation()">
      <h2 class="text-lg font-bold text-gray-800 mb-1">Reprogramar</h2>
      <p class="text-sm text-gray-500 mb-4">{{ ordem.descricao }} ({{ ordem.tecnicoNome }})</p>

      <label class="block text-sm font-medium text-slate-700 mb-1">Nova semana</label>
      <select [ngModel]="novaSemana()" (ngModelChange)="novaSemana.set($event)"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        @for (s of semanas; track s.value) {
          <option [value]="s.value">{{ s.label }}</option>
        }
      </select>
      <p class="text-xs text-gray-400 mt-1">Os dias dentro da semana nova são preenchidos como dias úteis (Seg-Sex) — ajuste depois em "Editar" se precisar de dias específicos.</p>

      @if (ordem.planoPreventivoId) {
        <label class="flex items-start gap-2 mt-4">
          <input type="checkbox" [ngModel]="recalcular()" (ngModelChange)="recalcular.set($event)" class="h-4 w-4 rounded border-slate-300 mt-0.5" />
          <span class="text-sm text-slate-700">Recalcular as próximas datas do plano a partir desta reprogramação<br>
            <span class="text-xs text-gray-400">Sem marcar, as próximas execuções previstas do plano continuam na mesma cadência de antes.</span>
          </span>
        </label>
      }

      <div class="flex justify-end gap-2 mt-6">
        <button type="button" (click)="fechar()" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:text-slate-800">Cancelar</button>
        <button type="button" (click)="confirmar()" [disabled]="isProcessando() || !novaSemana()"
          class="bg-blue-600 text-white text-sm font-semibold py-2 px-4 rounded-lg hover:bg-blue-700 transition disabled:opacity-50">
          Reprogramar
        </button>
      </div>
    </div>
  </div>
}
