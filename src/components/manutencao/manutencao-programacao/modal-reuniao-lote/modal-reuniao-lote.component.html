@if (aberto()) {
  <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4" (click)="fechar()">
    <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-sm" (click)="$event.stopPropagation()">
      <h3 class="text-lg font-bold text-gray-800 mb-1">Lançar reunião</h3>
      <p class="text-sm text-gray-500 mb-4">Avisa {{ todosTecnicos().length }} técnicos (Elétrica + Mecânica) de uma vez, nos dias marcados.</p>

      <label class="block text-sm font-medium text-slate-700 mb-1">Dia(s) <span class="text-red-500">*</span></label>
      <div class="flex flex-wrap gap-2 mb-4">
        @for (dia of diasDaSemanaAtual(); track dia.data) {
          <label class="flex flex-col items-center gap-1 cursor-pointer">
            <input type="checkbox" [checked]="dias().includes(dia.data)" (change)="toggleDia(dia.data)" class="rounded" />
            <span class="text-xs text-gray-500">{{ dia.label }}</span>
            <span class="text-[10px] text-gray-400">{{ diaMesPadded(dia.data) }}</span>
          </label>
        }
      </div>

      <label class="block text-sm font-medium text-slate-700 mb-1">Título</label>
      <input type="text" [ngModel]="titulo()" (ngModelChange)="titulo.set($event)"
        placeholder="Ex.: Reunião de segurança"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4" />

      <div class="grid grid-cols-2 gap-3 mb-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Horário <span class="text-red-500">*</span></label>
          <input type="time" [ngModel]="horario()" (ngModelChange)="horario.set($event)"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Local <span class="text-red-500">*</span></label>
          <input type="text" [ngModel]="local()" (ngModelChange)="local.set($event)"
            placeholder="Ex.: Sala de reuniões"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
      </div>

      <div class="flex justify-end gap-3">
        <button (click)="fechar()" class="text-sm text-gray-500 hover:text-gray-700 px-3 py-2">Cancelar</button>
        <button (click)="confirmar()" [disabled]="!canConfirmar()"
          class="bg-blue-600 text-white text-sm font-semibold py-2 px-4 rounded-lg hover:bg-blue-700 transition disabled:opacity-50">
          Aplicar pra {{ todosTecnicos().length }} técnicos
        </button>
      </div>
    </div>
  </div>
}
